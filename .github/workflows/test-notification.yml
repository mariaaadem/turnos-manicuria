name: Probar notificacion ntfy

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificacion
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PYTHON'
          import os
          import urllib.request

          topic = os.environ["NTFY_TOPIC"].strip()

          req = urllib.request.Request(
              "https://ntfy.sh/" + topic,
              data="Prueba exitosa. Las notificaciones de turnos funcionan.".encode("utf-8"),
              headers={
                  "Title": "PRUEBA TURNOS",
                  "Priority": "urgent"
              },
              method="POST"
          )

          urllib.request.urlopen(req, timeout=20).read()
          print("Notificacion enviada correctamente")
          PYTHON
